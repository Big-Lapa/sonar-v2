services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 3s
      retries: 10

  trading:
    build: ./trading
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      BINGX_API_KEY: ${BINGX_API_KEY}
      BINGX_API_SECRET: ${BINGX_API_SECRET}
      BYBIT_API_KEY: ${BYBIT_API_KEY}
      BYBIT_API_SECRET: ${BYBIT_API_SECRET}
      BINANCE_TESTNET_API_KEY: ${BINANCE_TESTNET_API_KEY}
      BINANCE_TESTNET_API_SECRET: ${BINANCE_TESTNET_API_SECRET}
      TRADING_ACCOUNTS_0_ID: ${TRADING_ACCOUNTS_0_ID}
      TRADING_ACCOUNTS_0_EXCHANGE: ${TRADING_ACCOUNTS_0_EXCHANGE}
      TRADING_ACCOUNTS_1_ID: ${TRADING_ACCOUNTS_1_ID}
      TRADING_ACCOUNTS_1_EXCHANGE: ${TRADING_ACCOUNTS_1_EXCHANGE}
      TRADING_ACCOUNTS_2_ID: ${TRADING_ACCOUNTS_2_ID}
      TRADING_ACCOUNTS_2_EXCHANGE: ${TRADING_ACCOUNTS_2_EXCHANGE}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  strategy:
    build: ./strategy
    depends_on:
      trading:
        condition: service_healthy
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS}
      TELEGRAM_PIN: ${TELEGRAM_PIN}
      TRADING_URL: http://trading:8080
      TV_BRIDGE_URL: ${TV_BRIDGE_URL}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
