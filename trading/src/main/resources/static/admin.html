<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sonar v2 Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="app.css?v=2026-08-21">
<style>
  /* Fractions are shown/entered as %, "%" is a visual suffix over a plain input.num. */
  .pct-wrap { position: relative; display: inline-flex; align-items: center; }
  .pct-wrap input { padding-right: 18px; }
  .pct-wrap::after { content: "%"; position: absolute; right: 6px; color: var(--faint); font-size: 11px; pointer-events: none; }
</style>
</head>
<body>
<div class="appbar">
  <h1>Sonar v2 Admin <small>trading · token-gated</small></h1>
  <span class="spacer"></span>
  <a href="#" id="btn-token" data-i18n="s.token">token</a>
  <span id="status">connecting…</span>
</div>

<div class="panel full" id="sec-risk">
  <h2 data-i18n="s.risk.title">Risk</h2>
  <div class="form-row">
    <label data-i18n="s.risk.account">Account</label>
    <select id="risk-account"></select>
  </div>
  <div id="risk-form"></div>
  <div class="form-row">
    <button class="primary" id="risk-save" data-i18n="s.save">Save</button>
    <span id="risk-status" class="muted"></span>
  </div>
</div>

<div class="panel full" id="sec-strategy">
  <h2 data-i18n="s.strategy.title">Strategy</h2>
  <div id="strategy-form"></div>
  <div class="form-row">
    <button class="primary" id="strategy-save" data-i18n="s.save">Save</button>
    <span id="strategy-status" class="muted"></span>
  </div>
  <h2 style="margin-top:14px" data-i18n="s.blacklist.title">Blacklist</h2>
  <div class="form-row">
    <input id="bl-symbol" class="num" placeholder="SYMBOL" style="width:140px">
    <input id="bl-reason" placeholder="reason" data-i18n-placeholder="s.blacklist.reason_ph" style="width:220px">
    <button id="bl-add" data-i18n="s.blacklist.add">Add</button>
  </div>
  <table id="bl-table"><thead><tr><th>Symbol</th><th data-i18n="s.blacklist.reason">Reason</th><th></th></tr></thead><tbody></tbody></table>
</div>

<div class="panel full" id="sec-positions">
  <h2 data-i18n="s.positions.title">Positions</h2>
  <div id="positions"></div>
</div>

<div class="toast" id="toast"></div>

<script src="admin/i18n.js"></script>
<script>
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));

// HTML-escape everything that comes from the server before it lands in an innerHTML template:
// blacklist symbols/reasons can be written from Telegram (/ban), and exchange/exception messages
// are foreign text. Unescaped, any of them would run script in the page that holds the admin token.
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function getToken() { return localStorage.getItem('sonar_admin_token') || ''; }
function setToken(t) { localStorage.setItem('sonar_admin_token', t); }

$('#btn-token').onclick = (e) => {
  e.preventDefault();
  const t = prompt('ADMIN_TOKEN', getToken());
  if (t !== null) { setToken(t); location.reload(); }
};

// Status line under a form: tagged with its key so a language switch re-translates it in place
// (I18N.applyDom) — the forms are never rebuilt, so unsaved edits survive.
function setStatus(sel, key, version) {
  const el = $(sel);
  el.setAttribute('data-i18n', key);
  el.setAttribute('data-args', JSON.stringify({ version }));
  el.textContent = I18N.t(key, { version });
}

function toast(msg, ok) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast ' + (ok ? 'ok' : 'err');
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}

async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'X-Admin-Token': getToken(), 'Content-Type': 'application/json' }, opts.headers || {});
  const resp = await fetch(path, opts);
  if (!resp.ok) {
    const text = await resp.text().catch(() => resp.statusText);
    throw new Error(`${resp.status}: ${text}`);
  }
  const ct = resp.headers.get('content-type') || '';
  return ct.includes('application/json') ? resp.json() : null;
}

// ---- Risk ----

const RISK_FIELDS = [
  ['riskPctPerTrade', 'pct'],
  ['maxPortfolioRiskPct', 'pct'],
  ['maxPositionNotional'],
  ['maxDailyRealizedLossPct', 'pct'],
  ['maxEquityDrawdownPct', 'pct'],
  ['maxOpenPositions'],
  ['maxLeverage'],
  ['active', 'checkbox'],
  ['tradable', 'checkbox'],
];

// A fraction (0.008) in the DB <-> percent (0.8) on screen — only for fields marked 'pct' above. Rounding
// happens on display only, to avoid 0.008000000000000001 from float arithmetic; what the user typed
// (parseFloat/100) goes back to the DB as-is, with no round-trip rounding.
function pctToFraction(pctStr) {
  const n = parseFloat(pctStr);
  return Number.isFinite(n) ? String(n / 100) : pctStr;
}
function fractionToPctDisplay(fractionVal) {
  const n = parseFloat(fractionVal);
  return Number.isFinite(n) ? String(Math.round(n * 100 * 1e8) / 1e8) : fractionVal;
}

let riskEntity = null;

async function loadAccounts() {
  const accounts = await api('/api/v1/accounts');
  const sel = $('#risk-account');
  sel.innerHTML = accounts.map(a => `<option value="${esc(a.id)}">${esc(a.id)} (${esc(a.exchange)})</option>`).join('');
  sel.onchange = loadRisk;
  await loadRisk();
  await loadPositions(accounts);
}

async function loadRisk() {
  const id = $('#risk-account').value;
  if (!id) return;
  riskEntity = await api(`/api/v1/accounts/${encodeURIComponent(id)}/risk`);
  const form = $('#risk-form');
  form.innerHTML = RISK_FIELDS.map(([key, kind]) => {
    const label = I18N.t('s.field.' + key);
    if (kind === 'checkbox') {
      return `<div class="form-row"><label data-i18n="s.field.${key}">${label}</label><input type="checkbox" id="f-${key}" ${riskEntity[key] ? 'checked' : ''}></div>`;
    }
    if (kind === 'pct') {
      return `<div class="form-row"><label data-i18n="s.field.${key}">${label}</label><span class="pct-wrap"><input class="num" id="f-${key}" value="${esc(fractionToPctDisplay(riskEntity[key]))}"></span></div>`;
    }
    return `<div class="form-row"><label data-i18n="s.field.${key}">${label}</label><input class="num" id="f-${key}" value="${esc(riskEntity[key])}"></div>`;
  }).join('');
  setStatus('#risk-status', 's.status.version', riskEntity.version);
}

$('#risk-save').onclick = async () => {
  const id = $('#risk-account').value;
  const body = { version: riskEntity.version };
  for (const [key, kind] of RISK_FIELDS) {
    const el = $(`#f-${key}`);
    body[key] = kind === 'checkbox' ? el.checked
      : (key === 'maxOpenPositions' || key === 'maxLeverage') ? parseInt(el.value, 10)
      : kind === 'pct' ? pctToFraction(el.value) : el.value;
  }
  try {
    riskEntity = await api(`/api/v1/accounts/${encodeURIComponent(id)}/risk`, { method: 'PUT', body: JSON.stringify(body) });
    setStatus('#risk-status', 's.status.saved', riskEntity.version);
    toast(I18N.t('s.toast.risk_saved'), true);
  } catch (e) {
    toast(I18N.t('s.toast.save_error', { error: e.message }), false);
  }
};

// ---- Strategy ----

// keep in sync: StrategySettingsController.ALLOWED_MODELS (Java), model-pricing.ts RATES (TS), candidate-search.service.ts ADAPTIVE_THINKING_MODELS (TS)
const LLM_MODELS = [
  ['claude-opus-5', 'Opus 5'],
  ['claude-sonnet-5', 'Sonnet 5'],
  ['claude-haiku-4-5-20251001', 'Haiku 4.5'],
];

const STRATEGY_FIELDS = [
  ['minSlDistancePct', 'pct'],
  ['minSlCostMult'],
  ['maxSlDistancePct', 'pct'],
  ['minRr'],
  ['min24hVolumeUsd'],
  ['maxMove24hPct', 'pct'],
  ['maxMove7dPct', 'pct'],
  ['maxCandidates'],
  ['llmModel', 'select'],
  ['alwaysDrawTv'],
  ['proposalTtlMs'],
  ['holdReminderDays'],
  ['searchCronHours'],
];

let settingsEntity = null;

async function loadStrategy() {
  settingsEntity = await api('/api/v1/strategy/settings');
  const form = $('#strategy-form');
  form.innerHTML = STRATEGY_FIELDS.map(([key, kind]) => {
    const label = I18N.t('s.field.' + key);
    if (key === 'alwaysDrawTv') {
      return `<div class="form-row"><label data-i18n="s.field.${key}">${label}</label><input type="checkbox" id="s-${key}" ${settingsEntity[key] ? 'checked' : ''}></div>`;
    }
    if (kind === 'select' && key === 'llmModel') {
      const current = settingsEntity[key];
      // A DB value outside LLM_MODELS (legacy, or set via the API) must not be silently
      // replaced by the first option — show it as selected; save will hit ALLOWED_MODELS.
      const known = LLM_MODELS.some(([value]) => value === current);
      const unknownOption = known ? ''
        : `<option value="${esc(current)}" selected data-i18n="s.model.unknown" data-args='${esc(JSON.stringify({ model: current }))}'>${esc(I18N.t('s.model.unknown', { model: current }))}</option>`;
      const options = LLM_MODELS.map(([value, optLabel]) =>
        `<option value="${value}" ${current === value ? 'selected' : ''}>${optLabel}</option>`
      ).join('');
      return `<div class="form-row"><label data-i18n="s.field.${key}">${label}</label><select id="s-${key}">${unknownOption}${options}</select></div>`;
    }
    if (kind === 'pct') {
      return `<div class="form-row"><label data-i18n="s.field.${key}">${label}</label><span class="pct-wrap"><input class="num" id="s-${key}" value="${esc(fractionToPctDisplay(settingsEntity[key]))}" style="width:200px"></span></div>`;
    }
    return `<div class="form-row"><label data-i18n="s.field.${key}">${label}</label><input class="num" id="s-${key}" value="${esc(settingsEntity[key])}" style="width:200px"></div>`;
  }).join('');
  setStatus('#strategy-status', 's.status.version', settingsEntity.version);
  await loadBlacklist();
}

$('#strategy-save').onclick = async () => {
  const body = { version: settingsEntity.version };
  for (const [key, kind] of STRATEGY_FIELDS) {
    const el = $(`#s-${key}`);
    if (key === 'alwaysDrawTv') { body[key] = el.checked; continue; }
    if (key === 'maxCandidates' || key === 'holdReminderDays') { body[key] = parseInt(el.value, 10); continue; }
    if (key === 'proposalTtlMs') { body[key] = parseInt(el.value, 10); continue; }
    body[key] = kind === 'pct' ? pctToFraction(el.value) : el.value;
  }
  try {
    settingsEntity = await api('/api/v1/strategy/settings', { method: 'PUT', body: JSON.stringify(body) });
    setStatus('#strategy-status', 's.status.saved', settingsEntity.version);
    toast(I18N.t('s.toast.strategy_saved'), true);
  } catch (e) {
    toast(I18N.t('s.toast.save_error', { error: e.message }), false);
  }
};

async function loadBlacklist() {
  const rows = await api('/api/v1/strategy/blacklist');
  $('#bl-table tbody').innerHTML = rows.map(r =>
    `<tr><td>${esc(r.symbol)}</td><td class="muted">${esc(r.reason || '')}</td>` +
    `<td><button data-symbol="${esc(r.symbol)}" class="bl-remove">✕</button></td></tr>`
  ).join('');
  $$('.bl-remove').forEach(btn => btn.onclick = async () => {
    await api(`/api/v1/strategy/blacklist/${encodeURIComponent(btn.dataset.symbol)}`, { method: 'DELETE' });
    await loadBlacklist();
  });
}

$('#bl-add').onclick = async () => {
  const symbol = $('#bl-symbol').value.trim().toUpperCase();
  if (!symbol) return;
  await api('/api/v1/strategy/blacklist', { method: 'POST', body: JSON.stringify({ symbol, reason: $('#bl-reason').value }) });
  $('#bl-symbol').value = ''; $('#bl-reason').value = '';
  await loadBlacklist();
};

// ---- Positions (accordion, collapsed by default, 5s throttle per account) ----

const lastFetch = {};

async function loadPositions(accounts) {
  const container = $('#positions');
  container.innerHTML = accounts.map(a => `
    <div class="accordion-head" data-account="${esc(a.id)}">
      <span class="arrow">▶</span> <b>${esc(a.id)}</b> <span class="muted">(${esc(a.exchange)})</span>
    </div>
    <div class="accordion-body" id="body-${esc(a.id)}"></div>
  `).join('');

  $$('.accordion-head').forEach(head => {
    head.onclick = () => {
      const id = head.dataset.account;
      const body = document.getElementById('body-' + id);
      const opening = !body.classList.contains('open');
      head.classList.toggle('open', opening);
      body.classList.toggle('open', opening);
      if (opening) refreshAccount(id);
    };
  });
}

async function refreshAccount(id) {
  const body = document.getElementById('body-' + id);
  body.innerHTML = esc(I18N.t('s.loading'));
  try {
    const [balance, positions] = await Promise.all([
      api(`/api/v1/accounts/${encodeURIComponent(id)}/balance?refresh=true`),
      api(`/api/v1/trade/positions?account=${encodeURIComponent(id)}`),
    ]);
    lastFetch[id] = Date.now();
    renderAccountBody(id, balance, positions);
  } catch (e) {
    body.innerHTML = `<span class="red">${esc(I18N.t('s.error', { error: e.message }))}</span>`;
  }
}

function renderAccountBody(id, balance, positions) {
  const body = document.getElementById('body-' + id);
  const balLine = balance.error
    ? `<span class="red">${esc(balance.error)}</span>`
    : `equity ${esc(balance.equity ?? balance.balance)} ${esc(balance.asset || '')} (unrealPnL ${esc(balance.unrealizedPnl ?? '—')})`;
  const rows = positions.map(p => `
    <tr class="${p.qtyMismatch ? 'bad' : ''}">
      <td>${esc(p.symbol)}</td><td>${esc(p.side)}</td><td class="num">${esc(p.quantity)}</td>
      <td class="num">${esc(p.entryPrice)}</td><td class="num">${esc(p.slPrice ?? '—')}</td><td class="num">${esc(p.tpPrice ?? '—')}</td>
      <td>${p.qtyMismatch ? `<span class="red">${esc(I18N.t('s.positions.mismatch'))}</span>` : ''}</td>
    </tr>`).join('');
  body.innerHTML = `
    <div class="form-row">
      <span>${balLine}</span>
      <button id="refresh-${esc(id)}">↻</button>
      <span class="muted" id="age-${esc(id)}"></span>
    </div>
    <table><thead><tr><th>Symbol</th><th>Side</th><th class="num">Qty</th><th class="num">Entry</th>
      <th class="num">SL</th><th class="num">TP</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="7" class="muted">${esc(I18N.t('s.positions.none'))}</td></tr>`}</tbody></table>`;
  document.getElementById('refresh-' + id).onclick = () => refreshAccount(id);
  tickAge(id);
}

function tickAge(id) {
  const el = document.getElementById('age-' + id);
  if (!el) return;
  const sec = Math.round((Date.now() - lastFetch[id]) / 1000);
  el.textContent = I18N.t('s.age', { sec });
  setTimeout(() => tickAge(id), 1000);
}

// ---- boot ----

// The language switcher lives in index.html (this page is embedded there). A switch fires
// 'langchange' here via the storage event, and I18N.applyDom has already re-translated every
// data-i18n label (form labels and status lines included). The page is deliberately NOT reloaded:
// that would silently discard unsaved edits to the risk / strategy forms. Transient texts
// (positions "loading…" / "updated N s ago") refresh on their next poll.

(async () => {
  await I18N.ready;
  if (!getToken()) {
    const t = prompt('ADMIN_TOKEN');
    if (t) setToken(t);
  }
  try {
    await loadAccounts();
    await loadStrategy();
    $('#status').textContent = 'ok';
  } catch (e) {
    $('#status').textContent = 'error';
    $('#status').className = 'err';
    toast(I18N.t('s.toast.load_error', { error: e.message }), false);
  }
})();
</script>
</body>
</html>
