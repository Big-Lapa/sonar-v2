server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: trading
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sonar}
    username: ${POSTGRES_USER:sonar}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    schemas: trading
    default-schema: trading

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

trading:
  ops:
    token: ${ADMIN_TOKEN:}
