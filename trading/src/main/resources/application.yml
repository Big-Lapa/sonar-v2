server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: trading
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sonar}
    username: ${POSTGRES_USER:sonar}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    schemas: trading
    default-schema: trading

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

trading:
  ops:
    token: ${ADMIN_TOKEN:}
  exchange: LIVE
  # Credentials and base URLs are per ACCOUNT (TRADING_ACCOUNTS_N_API_KEY/_API_SECRET/_BASE_URL),
  # not per venue — the same exchange can host a demo and a production account on different
  # domains. Only venue-wide behaviour knobs remain here.
  bybit:
    trigger-by: MarkPrice
  tp-sl:
    working-type: MARK_PRICE
