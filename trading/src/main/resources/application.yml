server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: trading
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sonar}
    username: ${POSTGRES_USER:sonar}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    schemas: trading
    default-schema: trading

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

trading:
  ops:
    token: ${ADMIN_TOKEN:}
  exchange: LIVE
  bingx:
    api-key: ${BINGX_API_KEY:}
    api-secret: ${BINGX_API_SECRET:}
  bybit:
    api-key: ${BYBIT_API_KEY:}
    api-secret: ${BYBIT_API_SECRET:}
    trigger-by: MarkPrice
  tp-sl:
    working-type: MARK_PRICE
